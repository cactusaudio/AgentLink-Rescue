version: 0.2B
node_types:
- layer
- failure_card
- observation
- verifier
- recipe
- symptom_route
safety_invariants:
- Read-only collectors before mutating recipes
- No recipe without verifier
- No mutating recipe without rollback
- Never auto-mutate Dante/AES67/RAVENNA/switch/PTP/QoS/VLAN settings
- External-provider path is read-only until local baseline passes
