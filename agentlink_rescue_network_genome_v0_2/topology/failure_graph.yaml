  reason: lower/earlier layer can mask later layer
- from: L13_external_provider
  to: L14_user_policy
  type: diagnose_before
  reason: lower/earlier layer can mask later layer
- from: L05_proxy
  to: L08_app_connectivity
  type: masks
  reason: proxy mismatch often appears as app failure
- from: L06_vpn_ne_tun
  to: L03_routing
  type: controls
  reason: VPN/TUN can own default and split routes
- from: L06_vpn_ne_tun
  to: L04_dns
  type: controls
  reason: VPN/TUN often installs scoped/global DNS
- from: L04_dns
  to: L08_app_connectivity
  type: masks
  reason: DNS failure often appears as tool failure
- from: L09_tls_identity
  to: L08_app_connectivity
  type: masks
  reason: TLS trust failures often appear as app/network failure
- from: L10_multicast_discovery
  to: L11_ptp_clock
  type: precedes
  reason: clock status cannot be trusted if discovery/interface is wrong
- from: L11_ptp_clock
  to: L12_aoip_media
  type: precedes
  reason: media quality depends on clock stability
- from: L07_firewall_pf
  to: L10_multicast_discovery
  type: blocks
  reason: host firewall can block multicast discovery
- from: L07_firewall_pf
  to: L11_ptp_clock
  type: blocks
  reason: host or switch policy can block PTP
