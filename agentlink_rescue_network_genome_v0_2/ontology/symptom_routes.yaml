version: 0.2B
routes:
- id: SYM-NO-INTERNET
  user_phrase:
  - Mac has no internet
  - all network down
  - cannot browse
  priority_layers:
  - L00_physical_link
  - L01_interface_service
  - L02_ip_dhcp
  - L03_routing
  - L04_dns
  - L05_proxy
  - L06_vpn_ne_tun
  - L07_firewall_pf
  - L13_external_provider
  first_verifiers:
  - ping gateway
  - curl direct IP
  - dig public domain
  - curl HTTPS baseline
- id: SYM-BROWSER-OK-CLI-FAIL
  user_phrase:
  - browser works terminal fails
  - curl fails browser works
  - Codex cannot connect but web works
  priority_layers:
  - L05_proxy
  - L08_app_connectivity
  - L09_tls_identity
  - L04_dns
  - L06_vpn_ne_tun
  first_verifiers:
  - scutil --proxy
  - env proxy diff
  - curl -Iv target
  - tool verbose probe
  ranking_boosts:
  - card_id: MAC-PROXY-002
    score: 35
    reason: shell proxy mismatch is the highest-priority browser/CLI split card
  - card_id: DEV-CURL-001
    score: 20
    reason: curl-specific browser split is a direct developer-tool candidate
  - card_id: CODEX-API-001
    score: 16
    reason: local/API agent connectivity belongs in the same split path
- id: SYM-VPN-LAN-LOSS
  user_phrase:
  - VPN on local network disappears
  - LAN unavailable with VPN
  - Dante gone after VPN
  priority_layers:
  - L06_vpn_ne_tun
  - L03_routing
  - L04_dns
  - L10_multicast_discovery
  first_verifiers:
  - route -n get LAN target
  - scutil --dns
  - ifconfig utun
  - multicast discovery check
  ranking_boosts:
  - id_prefix: VPN-
    score: 18
    reason: VPN-prefixed cards own VPN/LAN split cases
  - layer: L06_vpn_ne_tun
    score: 18
    reason: VPN/TUN layer is the primary route owner candidate
  - layer: L03_routing
    score: 18
    reason: routing layer decides LAN reachability under VPN
- id: SYM-CLASH-TUN-BROKEN
  user_phrase:
  - Clash TUN no network
  - Verge TUN DNS broken
  - mihomo TUN route issue
  priority_layers:
  - L06_vpn_ne_tun
  - L04_dns
  - L03_routing
  - L05_proxy
  first_verifiers:
  - Clash core/listener status
  - scutil --dns
  - route -n get default
  - local proxy port lsof
  ranking_boosts:
  - id_prefix: CLASH-
    score: 18
    reason: Clash-prefixed cards own Clash TUN and fake-IP cases
  - layer: L06_vpn_ne_tun
    score: 18
    reason: TUN ownership is central to this route
  - layer: L04_dns
    score: 18
    reason: fake-IP and TUN failures frequently surface as DNS failures
- id: SYM-CODEX-API-FAIL
  user_phrase:
  - Codex fails
  - OpenAI API unreachable
  - local agent cannot connect
  priority_layers:
  - L08_app_connectivity
  - L05_proxy
  - L04_dns
  - L09_tls_identity
  - L06_vpn_ne_tun
  - L13_external_provider
  first_verifiers:
  - curl target from same shell
  - Codex config diff
  - env whitelist/sandbox
  - TLS issuer check
  ranking_boosts:
  - card_id: CODEX-API-001
    score: 32
    reason: explicit Codex/API failure top candidate
  - card_id: DEV-CODEX-002
    score: 20
    reason: Codex shell environment policy can strip proxy or CA state
  - card_id: DEV-CURL-001
    score: 20
    reason: same-shell curl is the lowest-cost discriminator
  - card_id: MAC-PROXY-002
    score: 20
    reason: stale shell proxy is a common API-tool mismatch
- id: SYM-DANTE-INVISIBLE
  user_phrase:
  - Dante devices not visible
  - Dante Controller empty
  - audio devices disappeared
  priority_layers:
  - L00_physical_link
  - L01_interface_service
  - L02_ip_dhcp
  - L10_multicast_discovery
  - L07_firewall_pf
  - L11_ptp_clock
  first_verifiers:
  - expected NIC active
  - same subnet/static IP
  - controller interface selection
  - IGMP/multicast observation
  ranking_boosts:
  - id_prefix: DANTE-
    score: 18
    reason: Dante-prefixed cards own Dante discovery failures
  - layer: L10_multicast_discovery
    score: 18
    reason: discovery visibility is multicast first
  - layer: L00_physical_link
    score: 18
    reason: interface/link selection is the first physical boundary
- id: SYM-AES67-CLOCK-MEDIA
  user_phrase:
  - AES67 no audio
  - RAVENNA stream silent
  - PTP unlock
  - subscription but no sound
  priority_layers:
  - L10_multicast_discovery
  - L11_ptp_clock
  - L12_aoip_media
  - L02_ip_dhcp
  - L07_firewall_pf
  first_verifiers:
  - PTP lock/status
  - SAP/SDP stream params
  - IGMP/QoS switch state
  - receiver latency/channel map
